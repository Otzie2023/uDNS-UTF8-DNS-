[package]
name = "udns"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.42", features = ["serde"] }
idna = "1.0.3"
hex = "0.4"
rand = "0.8"  # The `rsa` crate uses this as a separate dependency[citation:3][citation:6]
sha2 = "0.10"
pem = "1.0"
base64 = "0.21"
simple_asn1 = "0.6"
rsa = "0.9"  # Remove the `features = ["rand"]` line
ed25519-dalek = "1.0"
sha3 = "0.10"
ring = "0.16"